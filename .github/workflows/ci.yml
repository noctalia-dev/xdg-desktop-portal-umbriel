name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      # Arch's rolling `clang` package is the pinned major; the guard fails loudly when Arch moves on.
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git clang
          clang-format --version | grep -q 'version 23\.' || { clang-format --version; echo "error: expected clang-format 23" >&2; exit 1; }

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' files < <(find src tests \( -name '*.cpp' -o -name '*.h' \) -print0)
          clang-format --dry-run -Werror "${files[@]}"
          if grep -InE '[[:blank:]]+$' "${files[@]}"; then
            printf 'Source files contain trailing whitespace.\n' >&2
            exit 1
          fi

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel clang git just meson ninja pkgconf \
            cairo gtk4 libdrm libei mesa nlohmann-json pipewire sdbus-cpp tomlplusplus wayland wayland-protocols

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare unprivileged build user
        run: |
          useradd --create-home ci
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Build
        run: runuser --user ci -- env HOME=/home/ci just build

      - name: Run unit tests
        run: runuser --user ci -- env HOME=/home/ci just test

  lint:
    name: Lint
    needs: build-test
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel clang git just meson ninja pkgconf \
            cairo gtk4 libdrm libei mesa nlohmann-json pipewire sdbus-cpp tomlplusplus wayland wayland-protocols

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check clang-tidy version
        run: |
          clang-tidy --version | grep -q 'version 23\.' || { clang-tidy --version; echo "error: expected clang-tidy 23" >&2; exit 1; }

      - name: Prepare unprivileged build user
        run: |
          useradd --create-home ci
          chown -R ci:ci "$GITHUB_WORKSPACE"

      - name: Run clang-tidy
        run: runuser --user ci -- env HOME=/home/ci just lint
